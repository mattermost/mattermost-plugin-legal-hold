name: ci
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions: {}

env:
  IS_CI: true

jobs:
  plugin-ci:
    permissions:
      contents: read
      id-token: write
    uses: mattermost/actions-workflows/.github/workflows/plugin-ci.yml@main
    secrets: inherit
